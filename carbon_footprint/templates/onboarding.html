{% extends "base.html" %}
{% block title %}Tell Us About You — Carbon Footprint{% endblock %}

{% block content %}
<!--
  onboarding.html
  ────────────────────────────────────────────────────────
  Collects user's name, city, and family size after signup.
  Only shown once (onboarding_done flag in DB controls this).
  ────────────────────────────────────────────────────────
-->
<div class="onboarding-page">
  <div class="onboard-card">
    <div class="onboard-icon">🏙️</div>
    <h1>Let's personalise your journey</h1>
    <p class="onboard-sub">We need a little info to show you how <em>your</em> choices affect <em>your</em> city.</p>

    <form action="{{ url_for('onboarding') }}" method="POST" class="onboard-form">

      <!-- Full Name -->
      <div class="form-group">
        <label for="full_name">Your Full Name</label>
        <input type="text" id="full_name" name="full_name"
               placeholder="e.g. Priya Sharma" required
               maxlength="100" />
      </div>

      <!-- City Selection -->
      <div class="form-group">
        <label for="city">Your City</label>
        <select id="city" name="city" required>
          <option value="" disabled selected>-- Select your city --</option>
          {% for c in cities %}
            <option value="{{ c }}">{{ c }}</option>
          {% endfor %}
        </select>
      </div>

      <!-- Family Size -->
      <div class="form-group">
        <label for="family_size">Family Members Living with You</label>
        <input type="number" id="family_size" name="family_size"
               min="1" max="20" value="4" required />
        <small class="hint">
          This helps us calculate your household's total CO₂ footprint.
        </small>
      </div>

      <button type="submit" class="btn-primary btn-full btn-large">
        Start My Journey 🌱
      </button>

    </form>
  </div>
</div>
{% endblock %}
